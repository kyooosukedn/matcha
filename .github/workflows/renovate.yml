name: Renovate
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-latest
    if: github.repository == 'floatpane/matcha'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.11
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: floatpane/matcha
